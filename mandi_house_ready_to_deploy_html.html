    function loadSavedState() {

        return JSON.parse(raw);
      } catch {

    function MandiHouseLogo({ logoUrl, size = 'md' }) {
      const dims = size === 'lg' ? 'w-20 h-20' : size === 'hero' ? 'w-24 h-24' : 'w-14 h-14';

      return (
        <div className={`${dims} rounded-full bg-[#9E141A] border-2 border-[#FFD100] flex items-center justify-center shadow-xl shrink-0 overflow-hidden`}>

    function ProductCard({ product, onAddToCart, dark = false }) {
      const [selectedVariant, setSelectedVariant] = useState(product.variants[0]);
      const [qty, setQty] = useState(1);
      const [added, setAdded] = useState(false);

      const activeVar = product.variants.find((v) => v.id === selectedVariant?.id) || product.variants[0];

      const handleAdd = () => {
        onAddToCart({
          productId: product.id,
          productName: product.name,
          image: product.image,
          variantId: activeVar.id,
          variantName: activeVar.name,
          unitPrice: activeVar.price,
          quantity: qty
        });
        setAdded(true);
        setTimeout(() => setAdded(false), 1000);
      };

      return (
        <div className={`rounded-2xl overflow-hidden border transition flex flex-col justify-between ${dark ? 'bg-[#240B0D] border-[#FFD100]/25 text-white' : 'bg-white border-stone-200 text-stone-900 shadow-sm hover:shadow-lg'}`}>
          <div>
            <div className="relative h-48 overflow-hidden bg-stone-800">
              <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
              <span className="absolute top-3 left-3 bg-[#B81D24] text-[#FFD100] text-xs font-extrabold px-3 py-1 rounded-full">
                {product.category}
              </span>
              <span className={`absolute top-3 right-3 text-xs font-bold px-2.5 py-1 rounded-full ${product.isAvailable ? 'bg-emerald-600 text-white' : 'bg-red-700 text-white'}`}>
                {product.isAvailable ? 'Available' : 'Sold Out'}
              </span>
            </div>
            <div className="p-5 space-y-3">
              <div className="flex justify-between items-start gap-2">
                <h3 className="text-xl font-black">{product.name}</h3>
                <span className="text-sm font-black text-[#B81D24] bg-[#FFD100] px-2.5 py-1 rounded-lg">
                  Rs. {activeVar.price.toLocaleString()}
                </span>
              </div>
              <p className={`text-xs leading-relaxed ${dark ? 'text-stone-300' : 'text-stone-600'}`}>{product.description}</p>
              <div className="flex flex-wrap gap-1.5 pt-1">
                {product.variants.map((v) => (
                  <button
                    key={v.id}
                    type="button"
                    onClick={() => setSelectedVariant(v)}
                    className={`text-xs font-bold px-3 py-1.5 rounded-lg border ${activeVar.id === v.id ? 'bg-[#B81D24] text-[#FFD100] border-[#B81D24]' : 'border-stone-300 text-stone-600 bg-white'}`}
                  >
                    {v.name}
                  </button>
                ))}
              </div>
            </div>
          </div>
          <div className="p-5 pt-0 flex items-center gap-3">
            <div className="flex items-center border rounded-xl overflow-hidden">
              <button type="button" onClick={() => setQty(Math.max(1, qty - 1))} className="px-3 py-2 font-bold">-</button>
              <span className="px-2.5 text-sm font-bold">{qty}</span>
              <button type="button" onClick={() => setQty(qty + 1)} className="px-3 py-2 font-bold">+</button>
            </div>
            <button
              type="button"
              disabled={!product.isAvailable}
              onClick={handleAdd}
              className="flex-1 bg-[#B81D24] text-[#FFD100] font-extrabold py-2.5 px-4 rounded-xl hover:bg-[#96141A] disabled:opacity-40 text-sm"
            >
              {added ? 'Added!' : 'Add to Cart'}
            </button>
          </div>
        </div>
      );
    }

    function MandiHouseApp() {
      const saved = useMemo(() => loadSavedState(), []);

      const [activeView, setActiveView] = useState('storefront');
      const [authUser, setAuthUser] = useState(null);
      const [customerUser, setCustomerUser] = useState(null);
      const [customers, setCustomers] = useState(
        saved?.customers || [
          { id: 'cust-1', name: 'Usman Tariq', phone: '0300-7654321', email: 'usman@example.com', password: 'user123', area: 'Nawan Kot Chowk, Khanpur', address: 'House 14, Street 3, Nawan Kot Chowk' }
        ]
      );
      const [customerAuthMode, setCustomerAuthMode] = useState('login');
      const [customerForm, setCustomerForm] = useState({ name: '', phone: '', email: '', password: '', area: 'Nawan Kot Chowk, Khanpur', address: '' });
      const [customerAuthError, setCustomerAuthError] = useState('');

      const [loginRoleTab, setLoginRoleTab] = useState('admin');
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [selectedCategory, setSelectedCategory] = useState('All');
      const [settings, setSettings] = useState(saved?.settings || INITIAL_SETTINGS);
      const [categories, setCategories] = useState(saved?.categories || INITIAL_CATEGORIES);
      const [products, setProducts] = useState(saved?.products || INITIAL_PRODUCTS);
      const [orders, setOrders] = useState(saved?.orders || INITIAL_ORDERS);
      const [riders, setRiders] = useState(saved?.riders || INITIAL_RIDERS);
      const [coupons, setCoupons] = useState(saved?.coupons || INITIAL_COUPONS);

      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [toast, setToast] = useState('');

      const [checkoutForm, setCheckoutForm] = useState({
        customerName: '',
        customerPhone: '',
        deliveryArea: 'Nawan Kot Chowk, Khanpur',
        deliveryAddress: '',
        paymentMethod: 'Cash on Delivery',
        transactionRef: ''
      });
      const [couponCode, setCouponCode] = useState('');
      const [appliedCoupon, setAppliedCoupon] = useState(null);

      const [trackOrderNum, setTrackOrderNum] = useState('MH-20261125-4821');
      const [trackPhone, setTrackPhone] = useState('0300-7654321');

      const [adminTab, setAdminTab] = useState('overview');
      const [receiptOrder, setReceiptOrder] = useState(null);
      const [newCategoryName, setNewCategoryName] = useState('');
      const [paymentNotifications, setPaymentNotifications] = useState(saved?.paymentNotifications || []);

      const [dishForm, setDishForm] = useState({
        name: '',
        category: 'Chicken Mandi',
        description: '',
        price: '',
        image: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=800&q=80'
      });

      const [riderForm, setRiderForm] = useState({
        name: '',
        phone: '',
        address: 'Nawan Kot Chowk, Khanpur',
        loginId: '',
        password: ''
      });

      const [couponForm, setCouponForm] = useState({
        code: '',
        type: 'percentage',
        value: '',
        minOrder: '1000'
      });

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      // Persist changes in browser storage so Admin updates stay saved across reloads
      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              settings,
              categories,
              products,
              orders,
              riders,
              coupons,
              customers,
              paymentNotifications
            })
          );
        } catch {}
      }, [settings, categories, products, orders, riders, coupons, customers, paymentNotifications]);

      useEffect(() => {
        const checkHash = () => {
          if (window.location.hash === '#/login') {
            setLoginError('');
            setActiveView('login');
          }
        };
        checkHash();
        window.addEventListener('hashchange', checkHash);
        const onKey = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'l') {
            e.preventDefault();
            window.location.hash = '#/login';
            setActiveView('login');
          }
        };
        window.addEventListener('keydown', onKey);
        return () => {
          window.removeEventListener('hashchange', checkHash);
          window.removeEventListener('keydown', onKey);
        };
      }, []);

      const handleStaffLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const id = loginEmail.trim().toLowerCase();
        if (loginRoleTab === 'admin') {
          if (id === 'malikmubeenahmad1@gmail.com' && loginPassword === 'mubeen@123') {
            setAuthUser({ role: 'admin', email: id, name: 'Malik Mubeen Ahmad' });
            setActiveView('admin');
            setLoginEmail('');
            setLoginPassword('');
            notify('Admin login successful');
          } else {
            setLoginError('Invalid Admin Gmail or Password');
          }
        } else {
          const r = riders.find((item) => item.loginId.toLowerCase() === id && item.password === loginPassword);
          if (!r) {
            setLoginError('Invalid Rider Login ID or Password');
            return;
          }
          if (!r.active) {
            setLoginError('Rider account is deactivated');
            return;
          }
          setAuthUser({ role: 'rider', email: r.loginId, name: r.name, riderId: r.id, code: r.code });
          setActiveView('rider');
          setLoginEmail('');
          setLoginPassword('');
          notify(`Logged in as ${r.name}`);
        }
      };

      const handleCustomerAuth = (e) => {
        e.preventDefault();
        setCustomerAuthError('');
        if (customerAuthMode === 'login') {
          const found = customers.find(
            (c) =>
              (c.email.toLowerCase() === customerForm.email.trim().toLowerCase() ||
                c.phone.replace(/\D/g, '') === customerForm.email.replace(/\D/g, '')) &&
              c.password === customerForm.password
          );
          if (!found) {
            setCustomerAuthError('Invalid credentials');
            return;
          }
          setCustomerUser(found);
          setCheckoutForm((p) => ({
            ...p,
            customerName: found.name,
            customerPhone: found.phone,
            deliveryArea: found.area,
            deliveryAddress: found.address
          }));
          setActiveView('account');
          notify(`Welcome, ${found.name}`);
        } else {
          const created = {
            id: `cust-${Date.now()}`,
            name: customerForm.name.trim(),
            phone: customerForm.phone.trim(),
            email: customerForm.email.trim() || `${Date.now()}@customer.pk`,
            password: customerForm.password,
            area: customerForm.area,
            address: customerForm.address
          };
          setCustomers((p) => [...p, created]);
          setCustomerUser(created);
          setCheckoutForm((p) => ({
            ...p,
            customerName: created.name,
            customerPhone: created.phone,
            deliveryArea: created.area,
            deliveryAddress: created.address
          }));
          setActiveView('account');
          notify('Account created');
        }
      };

      const handleFileUpload = (file, cb) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') cb(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const addToCart = (item) => {
        setCart((prev) => {
          const idx = prev.findIndex((i) => i.productId === item.productId && i.variantId === item.variantId);
          if (idx > -1) {
            const copy = [...prev];
            copy[idx].quantity += item.quantity;
            return copy;
          }
          return [...prev, item];
        });
        notify(`${item.productName} added to cart`);
      };

      const subtotal = cart.reduce((s, i) => s + i.unitPrice * i.quantity, 0);
      const discountAmount = useMemo(() => {
        if (!appliedCoupon || subtotal < appliedCoupon.minOrder) return 0;
        return appliedCoupon.type === 'percentage'
          ? Math.round((subtotal * appliedCoupon.value) / 100)
          : appliedCoupon.value;
      }, [appliedCoupon, subtotal]);
      const deliveryFee = subtotal === 0 || subtotal >= settings.freeDeliveryThreshold ? 0 : settings.deliveryCharge;
      const grandTotal = Math.max(0, subtotal - discountAmount) + deliveryFee;

      const handlePlaceOrder = (e) => {
        e.preventDefault();
        if (cart.length === 0) return;
        const orderNumber = `MH-20261125-${Math.floor(1000 + Math.random() * 9000)}`;
        const newOrder = {
          id: `ord-${Date.now()}`,
          orderNumber,
          customerName: checkoutForm.customerName,
          customerPhone: checkoutForm.customerPhone,
          deliveryArea: checkoutForm.deliveryArea,
          deliveryAddress: checkoutForm.deliveryAddress,
          paymentMethod: checkoutForm.paymentMethod,
          paymentStatus: checkoutForm.paymentMethod === 'Cash on Delivery' ? 'Pending' : 'Verified',
          transactionRef: checkoutForm.transactionRef,
          items: cart.map((c) => ({
            productName: c.productName,
            variantName: c.variantName,
            quantity: c.quantity,
            totalPrice: c.unitPrice * c.quantity
          })),
          subtotal,
          deliveryFee,
          discountAmount,
          grandTotal,
          status: 'Order Received',
          riderId: null,
          createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setOrders((p) => [newOrder, ...p]);
        if (checkoutForm.paymentMethod !== 'Cash on Delivery') {
          setPaymentNotifications((p) => [
            {
              id: `pn-${Date.now()}`,
              orderNumber,
              customerName: checkoutForm.customerName,
              method: checkoutForm.paymentMethod,
              transactionRef: checkoutForm.transactionRef || 'N/A',
              amount: grandTotal,
              time: newOrder.createdAt,
              read: false
            },
            ...p
          ]);
        }
        setCart([]);
        setAppliedCoupon(null);
        setTrackOrderNum(orderNumber);
        setTrackPhone(checkoutForm.customerPhone);
        setActiveView('track');
        notify(`Order ${orderNumber} placed!`);
      };

      const updateOrder = (id, patch) => {
        setOrders((prev) =>
          prev.map((o) => {
            if (o.id !== id) return o;
            const updated = { ...o, ...patch };
            if (patch.paymentStatus === 'Verified' && o.paymentStatus !== 'Verified') {
              setPaymentNotifications((pn) => [
                {
                  id: `pn-${Date.now()}`,
                  orderNumber: o.orderNumber,
                  customerName: o.customerName,
                  method: o.paymentMethod,
                  transactionRef: o.transactionRef || 'Cash Collected',
                  amount: o.grandTotal,
                  time: 'Just now',
                  read: false
                },
                ...pn
              ]);
            }
            return updated;
          })
        );
        notify('Order updated');
      };

      const trackedOrder = orders.find(
        (o) =>
          o.orderNumber.toUpperCase() === trackOrderNum.trim().toUpperCase() &&
          o.customerPhone.replace(/\D/g, '').endsWith(trackPhone.replace(/\D/g, '').slice(-7))
      );

      const visibleProducts = products.filter((p) => selectedCategory === 'All' || p.category === selectedCategory);
      const totalRevenue = orders.filter((o) => o.status !== 'Cancelled').reduce((s, o) => s + o.grandTotal, 0);

      return (
        <div className="min-h-screen flex flex-col">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-[#1A0809] text-[#FFD100] border-2 border-[#FFD100] px-4 py-3 rounded-xl font-bold text-xs shadow-xl">
              {toast}
            </div>
          )}

          {/* BAR 1: TOP BRAND BAR */}
          <header className="sticky top-0 z-40 shadow-lg">
            <div className="bg-gradient-to-r from-[#9E141A] via-[#B81D24] to-[#7A0E14] text-white border-b border-[#FFD100]/40">
              <div className="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between gap-4">
                <button onClick={() => setActiveView('storefront')} className="flex items-center gap-3">
                  <MandiHouseLogo logoUrl={settings.logoUrl} size="md" />
                  <span className="text-xl sm:text-2xl font-black text-[#FFD100] tracking-wide whitespace-nowrap">
                    {settings.restaurantName}
                  </span>
                </button>
                <div className="hidden md:flex items-center gap-4 text-xs font-bold">
                  <span>{settings.address}</span>
                  <span className="bg-black/25 border border-[#FFD100]/40 px-3 py-1.5 rounded-lg text-[#FFD100]">
                    {settings.phone}
                  </span>

                      {products.map((p) => (
                        <div key={p.id} className="bg-white p-3.5 rounded-xl border flex justify-between items-center">
                          <div className="flex items-center gap-3">
                            <img src={p.image} alt={p.name} className="w-12 h-12 rounded-lg object-cover" />
                            <div><p className="font-bold text-sm">{p.name}</p><p className="text-xs text-stone-500">{p.category} • Rs. {p.variants[0]?.price}</p></div>
                          </div>
                          <button onClick={() => setProducts((prev) => prev.filter((x) => x.id !== p.id))} className="text-red-600 text-xs font-bold">Delete</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'riders' && (
                  <div className="space-y-4">
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        setRiders((r) => [
                          ...r,
                          {
                            id: `r-${Date.now()}`,
                            code: `MH-R0${r.length + 1}`,
                            name: riderForm.name,
                            phone: riderForm.phone,
                            address: riderForm.address,
                            loginId: riderForm.loginId.trim(),
                            password: riderForm.password,
                            active: true
                          }
                        ]);
                        setRiderForm({ name: '', phone: '', address: 'Nawan Kot Chowk, Khanpur', loginId: '', password: '' });
                        notify('Rider & Login ID created');
                      }}
                      className="bg-white p-6 rounded-2xl border space-y-3"
                    >
                      <h3 className="font-black text-base text-[#B81D24]">Add Rider & Login ID</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input required value={riderForm.name} onChange={(e) => setRiderForm({ ...riderForm, name: e.target.value })} placeholder="Rider Name" className="border rounded-xl p-2.5 text-sm" />
                        <input required value={riderForm.phone} onChange={(e) => setRiderForm({ ...riderForm, phone: e.target.value })} placeholder="Rider Phone" className="border rounded-xl p-2.5 text-sm" />
                        <input required value={riderForm.loginId} onChange={(e) => setRiderForm({ ...riderForm, loginId: e.target.value })} placeholder="Rider Login ID" className="border rounded-xl p-2.5 text-sm" />
                        <input required value={riderForm.password} onChange={(e) => setRiderForm({ ...riderForm, password: e.target.value })} placeholder="Rider Password" className="border rounded-xl p-2.5 text-sm" />
                      </div>
                      <button className="bg-[#B81D24] text-[#FFD100] px-5 py-2.5 rounded-xl text-xs font-black">+ Create Rider</button>
                    </form>

                    {riders.map((r) => (
                      <div key={r.id} className="bg-white p-4 rounded-xl border flex justify-between items-center text-xs">
                        <div><p className="font-black text-sm">{r.name} ({r.code})</p><p>ID: <strong>{r.loginId}</strong> • Pass: {r.password}</p></div>
                        <button onClick={() => setRiders((prev) => prev.map((x) => x.id === r.id ? { ...x, active: !x.active } : x))} className="px-3 py-1 rounded-full font-bold bg-stone-100">
                          {r.active ? 'Active' : 'Disabled'}
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {adminTab === 'coupons' && (
                  <div className="bg-white p-6 rounded-2xl border space-y-4">
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        setCoupons((c) => [{ id: `c-${Date.now()}`, code: couponForm.code.toUpperCase(), type: couponForm.type, value: Number(couponForm.value), minOrder: Number(couponForm.minOrder) || 0, active: true }, ...c]);
                        setCouponForm({ code: '', type: 'percentage', value: '', minOrder: '1000' });
                        notify('Coupon created');
                      }}
                      className="grid grid-cols-1 sm:grid-cols-4 gap-2"
                    >
                      <input required value={couponForm.code} onChange={(e) => setCouponForm({ ...couponForm, code: e.target.value })} placeholder="CODE" className="border rounded-xl p-2.5 text-sm uppercase" />
                      <select value={couponForm.type} onChange={(e) => setCouponForm({ ...couponForm, type: e.target.value })} className="border rounded-xl p-2.5 text-sm bg-white">
                        <option value="percentage">Percentage (%)</option>
                        <option value="fixed">Fixed PKR</option>
                      </select>
                      <input required type="number" value={couponForm.value} onChange={(e) => setCouponForm({ ...couponForm, value: e.target.value })} placeholder="Value" className="border rounded-xl p-2.5 text-sm" />
                      <button className="bg-[#B81D24] text-[#FFD100] rounded-xl text-xs font-black">+ Add</button>
                    </form>
                    <div className="flex flex-wrap gap-2">
                      {coupons.map((c) => (
                        <span key={c.id} className="bg-amber-50 border border-amber-300 px-3 py-1.5 rounded-xl text-xs font-black">
                          {c.code} ({c.type === 'percentage' ? `${c.value}%` : `Rs.${c.value}`})
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'settings' && (
                  <div className="bg-white p-6 rounded-2xl border space-y-4 text-sm">
                    <div className="flex flex-wrap justify-between items-center gap-2 border-b pb-3">
                      <h2 className="font-black text-lg text-[#B81D24]">Payment Accounts & Timetable</h2>
                      <button
                        type="button"
                        onClick={() => setSettings({ ...settings, isStoreOpen: !settings.isStoreOpen })}
                        className={`px-4 py-1.5 rounded-xl text-xs font-black text-white ${settings.isStoreOpen ? 'bg-emerald-600' : 'bg-red-700'}`}
                      >
                        {settings.isStoreOpen ? 'Status: OPEN' : 'Status: CLOSED'}
                      </button>
                    </div>

                    <div className="p-4 rounded-xl bg-amber-50 border border-amber-300 space-y-3">
                      <div className="flex flex-wrap justify-between items-center gap-2">
                        <p className="font-black text-xs uppercase text-[#B81D24]">Daily Open & Close Timetable</p>
                        <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                          <input
                            type="checkbox"
                            checked={!!settings.autoScheduleHours}
                            onChange={(e) => setSettings({ ...settings, autoScheduleHours: e.target.checked })}
                          />
                          Auto-follow Open/Close Timetable
                        </label>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-[11px] font-extrabold uppercase mb-1">Opening Time</label>
                          <input
                            type="time"
                            value={settings.openTime || '12:00'}
                            onChange={(e) => {
                              const nextOpen = e.target.value;
                              setSettings({
                                ...settings,
                                openTime: nextOpen,
                                openingHours: `${nextOpen} - ${settings.closeTime || '02:00'}`
                              });
                            }}
                            className="w-full border rounded-xl p-2.5 bg-white font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-extrabold uppercase mb-1">Closing Time</label>
                          <input
                            type="time"
                            value={settings.closeTime || '02:00'}
                            onChange={(e) => {
                              const nextClose = e.target.value;
                              setSettings({
                                ...settings,
                                closeTime: nextClose,
                                openingHours: `${settings.openTime || '12:00'} - ${nextClose}`
                              });
                            }}
                            className="w-full border rounded-xl p-2.5 bg-white font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-extrabold uppercase mb-1">Display Timetable Label</label>
                          <input
                            value={settings.openingHours}
                            onChange={(e) => setSettings({ ...settings, openingHours: e.target.value })}
                            placeholder="12:00 PM - 02:00 AM"
                            className="w-full border rounded-xl p-2.5 bg-white font-bold"
                          />
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <input value={settings.bankName} onChange={(e) => setSettings({ ...settings, bankName: e.target.value })} placeholder="Bank Name" className="border rounded-xl p-2.5" />
                      <input value={settings.bankAccountNumber} onChange={(e) => setSettings({ ...settings, bankAccountNumber: e.target.value })} placeholder="Bank Account / IBAN" className="border rounded-xl p-2.5" />
                      <input value={settings.easypaisaNumber} onChange={(e) => setSettings({ ...settings, easypaisaNumber: e.target.value })} placeholder="Easypaisa Number" className="border rounded-xl p-2.5" />
                      <input value={settings.jazzcashNumber} onChange={(e) => setSettings({ ...settings, jazzcashNumber: e.target.value })} placeholder="JazzCash Number" className="border rounded-xl p-2.5" />
                    </div>
                  </div>
                )}
              </section>
            </main>
          )}

          {/* RIDER PORTAL */}
          {activeView === 'rider' && authUser?.role === 'rider' && (
            <main className="flex-1 max-w-2xl mx-auto px-4 py-10 space-y-4 w-full">
              <div className="bg-[#1A0809] text-white p-5 rounded-2xl border-b-4 border-[#FFD100]">
                <h1 className="text-xl font-black text-[#FFD100]">Rider Portal • {authUser.name}</h1>
              </div>
              {orders.filter((o) => o.riderId === authUser.riderId).map((o) => (
                <div key={o.id} className="bg-white p-5 rounded-2xl border space-y-3">
                  <div className="flex justify-between font-black">
                    <span className="text-[#B81D24]">{o.orderNumber}</span>
                    <span>Rs. {o.grandTotal.toLocaleString()}</span>
                  </div>
                  <p className="text-sm font-bold">{o.customerName} • {o.deliveryAddress}</p>
                  <div className="flex gap-2">
                    <button onClick={() => updateOrder(o.id, { status: 'Out for Delivery' })} className="bg-amber-500 text-stone-950 px-4 py-2 rounded-xl text-xs font-black">Picked Up</button>
                    <button onClick={() => updateOrder(o.id, { status: 'Delivered', paymentStatus: 'Verified' })} className="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-black">Delivered</button>
                  </div>
                </div>
              ))}
            </main>
          )}

          {/* CART DRAWER */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex justify-end">
              <div className="bg-white w-full max-w-md h-full p-5 flex flex-col justify-between">
                <div className="space-y-3 overflow-y-auto">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h2 className="font-black text-lg text-[#B81D24]">Cart</h2>
                    <button onClick={() => setCartOpen(false)} className="font-black text-lg">X</button>
                  </div>
                  {cart.length === 0 ? (
                    <p className="text-sm text-stone-500 py-10 text-center">Cart is empty</p>
                  ) : (
                    cart.map((c, i) => (
                      <div key={i} className="flex justify-between items-center border-b pb-2 text-sm">
                        <span>{c.quantity}x {c.productName} ({c.variantName})</span>
                        <span className="font-bold">Rs. {(c.unitPrice * c.quantity).toLocaleString()}</span>
                      </div>
                    ))
                  )}
                </div>
                {cart.length > 0 && (
                  <button
                    onClick={() => {
                      setCartOpen(false);
                      setActiveView('checkout');
                    }}
                    className="w-full bg-[#B81D24] text-[#FFD100] font-black py-3 rounded-xl"
                  >
                    Checkout • Rs. {subtotal.toLocaleString()}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* RECEIPT MODAL */}
          {receiptOrder && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div className="bg-white max-w-sm w-full p-6 rounded-2xl space-y-3 font-mono text-xs">
                <h3 className="font-black text-center text-base">{settings.restaurantName}</h3>
                <p>Order #: {receiptOrder.orderNumber}</p>
                <p>Customer: {receiptOrder.customerName} ({receiptOrder.customerPhone})</p>
                <p className="font-black text-sm border-t pt-2">Total: Rs. {receiptOrder.grandTotal}</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => window.print()} className="flex-1 bg-[#B81D24] text-[#FFD100] py-2 rounded-lg font-sans font-bold">Print</button>
                  <button onClick={() => setReceiptOrder(null)} className="flex-1 bg-stone-200 py-2 rounded-lg font-sans font-bold">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#1A0809] text-stone-300 border-t-4 border-[#FFD100] mt-12">
            <div className="max-w-7xl mx-auto px-4 py-8 flex flex-wrap justify-between items-center gap-4 text-xs">
              <div className="flex items-center gap-3">
                <MandiHouseLogo logoUrl={settings.logoUrl} size="md" />
                <div>
                  <p className="font-black text-base text-[#FFD100]">{settings.restaurantName}</p>
                  <p className="text-stone-400">{settings.address} • {settings.phone}</p>
                </div>
              </div>
              <div className="flex gap-4 font-bold">
                <button onClick={() => setActiveView('storefront')} className="hover:text-[#FFD100]">Home</button>
                <button onClick={() => setActiveView('menu')} className="hover:text-[#FFD100]">Full Menu</button>
                <button onClick={() => setActiveView('track')} className="hover:text-[#FFD100]">Track Order</button>
                <button onClick={() => setActiveView('account')} className="hover:text-[#FFD100]">Customer Login</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MandiHouseApp />);
  </script>
</body>
</html>
